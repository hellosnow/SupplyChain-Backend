    name: supplychain-backend
    issues:

      # =====================================================================
      # MANDATORY — Must fix before Azure deployment
      # =====================================================================

      - id: azure-java-version-02000
        title: "Legacy Java version (Java 8)"
        severity: mandatory
        effort: 5
        category: java-version-upgrade
        domain: java-upgrade
        incidents: 3
        locations:
          - file: pom.xml
            line: 24
            detail: "<java.version>8</java.version>"
          - file: pom.xml
            line: 25
            detail: "<maven.compiler.source>8</maven.compiler.source>"
          - file: pom.xml
            line: 26
            detail: "<maven.compiler.target>8</maven.compiler.target>"
        description: >
          The application uses Java 8 which has known security vulnerabilities
          and is not recommended for Azure deployments. Upgrade to Java 17 (LTS)
          or Java 21 (LTS) for security patches, performance improvements, and
          full Azure platform support.
        recommendation: "Upgrade to Java 17 or 21 LTS"

      - id: spring-boot-to-azure-spring-boot-version-01000
        title: "Spring Boot 2.7.18 — End of OSS Support"
        severity: mandatory
        effort: 8
        category: framework-upgrade
        domain: java-upgrade
        incidents: 5
        locations:
          - file: pom.xml
            line: 34
            detail: "spring-boot-starter-web"
          - file: pom.xml
            line: 40
            detail: "spring-boot-starter-data-jpa"
          - file: pom.xml
            line: 53
            detail: "spring-boot-starter-amqp"
          - file: pom.xml
            line: 66
            detail: "spring-boot-starter-validation"
          - file: pom.xml
            line: 72
            detail: "spring-boot-starter-test"
        description: >
          Spring Boot 2.7.x reached End of OSS Support on 2023-11-24. The
          application must be upgraded to Spring Boot 3.x (requires Java 17+)
          for continued security patches, new features, and Azure compatibility.
        recommendation: "Upgrade to Spring Boot 3.2+ (requires Java 17+)"

      - id: spring-framework-version-01000
        title: "Spring Framework 5.3.x — End of OSS Support"
        severity: mandatory
        effort: 8
        category: framework-upgrade
        domain: java-upgrade
        incidents: 3
        locations:
          - file: pom.xml
            line: 34
            detail: "spring-boot-starter-web (transitively pulls Spring Framework 5.3.x)"
          - file: pom.xml
            line: 40
            detail: "spring-boot-starter-data-jpa"
          - file: pom.xml
            line: 53
            detail: "spring-boot-starter-amqp"
        description: >
          Spring Framework 5.3.x (pulled transitively by Spring Boot 2.7) is
          End of OSS Support. Upgrading Spring Boot to 3.x will bring Spring
          Framework 6.x automatically.
        recommendation: "Upgrade Spring Boot to 3.x (brings Spring Framework 6.x)"

      - id: localhost-http-00001
        title: "Local HTTP calls detected"
        severity: mandatory
        effort: 3
        category: local-resource-access
        domain: cloud-readiness
        incidents: 1
        locations:
          - file: src/main/java/com/acme/scm/SupplyChainBackendApplication.java
            line: 25
            detail: "http://localhost:8080/api"
        description: >
          Hardcoded reference to localhost. In a cloud environment this will not
          resolve correctly. Use environment variables or service discovery.
        recommendation: "Remove or externalize localhost references"

      - id: unsecure-network-protocol-00000
        title: "Use of unsecured network protocols (HTTP)"
        severity: mandatory
        effort: 3
        category: remote-communication
        domain: cloud-readiness
        incidents: 2
        locations:
          - file: src/main/java/com/acme/scm/service/VendorService.java
            line: 49
            detail: "http://vendor-rating-service/api/ratings/"
          - file: src/main/java/com/acme/scm/SupplyChainBackendApplication.java
            line: 25
            detail: "http://localhost:8080/api"
        description: >
          The application uses HTTP instead of HTTPS for service-to-service
          communication. All cloud traffic must use encrypted protocols.
        recommendation: "Replace HTTP with HTTPS for all URLs"

      # =====================================================================
      # OPTIONAL — Recommended for Azure best practices
      # =====================================================================

      - id: azure-message-queue-rabbitmq-01000
        title: "Spring RabbitMQ usage found in code"
        severity: optional
        effort: 5
        category: messaging-service-migration
        domain: cloud-readiness
        incidents: 4
        locations:
          - file: src/main/java/com/acme/scm/config/AppConfig.java
            line: 4
            detail: "import org.springframework.amqp.rabbit.connection.ConnectionFactory"
          - file: src/main/java/com/acme/scm/config/AppConfig.java
            line: 5
            detail: "import org.springframework.amqp.rabbit.core.RabbitTemplate"
          - file: src/main/java/com/acme/scm/service/InventoryService.java
            line: 6
            detail: "import org.springframework.amqp.rabbit.core.RabbitTemplate"
          - file: src/main/java/com/acme/scm/service/PurchaseOrderService.java
            line: 6
            detail: "import org.springframework.amqp.rabbit.core.RabbitTemplate"
        description: >
          The application uses RabbitMQ via Spring AMQP for messaging (3 queues:
          order.created, inventory.alert, approval.pending). Consider migrating
          to Azure Service Bus for managed messaging with higher SLA.
        recommendation: "Migrate from RabbitMQ to Azure Service Bus"

      - id: azure-message-queue-amqp-02000
        title: "Spring AMQP dependency found"
        severity: optional
        effort: 5
        category: messaging-service-migration
        domain: cloud-readiness
        incidents: 2
        locations:
          - file: pom.xml
            line: 53
            detail: "spring-boot-starter-amqp dependency"
        description: >
          The spring-boot-starter-amqp dependency is used for RabbitMQ
          messaging. Azure Service Bus provides a fully managed alternative with
          native Spring Boot support.
        recommendation: "Replace spring-boot-starter-amqp with Azure Service Bus SDK"

      - id: hardcoded-urls-00001
        title: "Hardcoded URLs in source code"
        severity: optional
        effort: 3
        category: remote-communication
        domain: cloud-readiness
        incidents: 2
        locations:
