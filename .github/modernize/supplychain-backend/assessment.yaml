            detail: "http://localhost:8080/api"
          - file: src/main/java/com/acme/scm/service/VendorService.java
            line: 49
            detail: "http://vendor-rating-service/api/ratings/"
        description: >
          Hardcoded URLs must be externalized to configuration or environment
          variables for cloud deployments where service endpoints change.
        recommendation: "Externalize URLs to application.yml or environment variables"

      # =====================================================================
      # POTENTIAL — Consider for cloud migration
      # =====================================================================

      - id: azure-database-mysql-01000
        title: "MySQL database found"
        severity: potential
        effort: 5
        category: database-migration
        domain: cloud-readiness
        incidents: 2
        locations:
          - file: src/main/resources/application.yml
            line: 11
            detail: "jdbc:mysql://mysql:3306/supplychain"
        description: >
          The application uses MySQL 8.0. Consider migrating to Azure Database
          for MySQL Flexible Server for managed backups, high availability,
          monitoring, and passwordless connections with Managed Identity.
        recommendation: "Migrate to Azure Database for MySQL Flexible Server"

      - id: azure-password-01000
        title: "Passwords found in configuration files"
        severity: potential
        effort: 3
        category: local-credential
        domain: cloud-readiness
        incidents: 2
        locations:
          - file: src/main/resources/application.yml
            line: 13
            detail: "spring.datasource.password: root"
          - file: src/main/resources/application.yml
            line: 31
            detail: "spring.rabbitmq.password: guest"
        description: >
          Clear-text passwords found in application.yml for both MySQL and
          RabbitMQ. These must be moved to Azure Key Vault or replaced with
          passwordless/Managed Identity connections.
        recommendation: "Use Azure Key Vault or Managed Identity for credentials"

    # =======================================================================
    # Additional Code-Level Findings (manual analysis)
    # =======================================================================
    additionalFindings:

      - id: javax-to-jakarta-namespace
        title: "javax.persistence imports must migrate to jakarta.persistence"
        severity: mandatory
        category: framework-upgrade
        domain: java-upgrade
        affectedFiles:
          - src/main/java/com/acme/scm/model/Vendor.java
          - src/main/java/com/acme/scm/model/PurchaseOrder.java
          - src/main/java/com/acme/scm/model/Inventory.java
        description: >
          All 3 JPA entity classes use javax.persistence.* imports. Spring Boot
          3.x requires Jakarta EE 9+ which renamed javax.* to jakarta.*.
        recommendation: "Replace javax.persistence with jakarta.persistence"

      - id: deprecated-mysql-dialect
        title: "Deprecated Hibernate dialect: MySQL5InnoDBDialect"
        severity: optional
        category: framework-upgrade
        domain: java-upgrade
        affectedFiles:
          - src/main/resources/application.yml
        description: >
          MySQL5InnoDBDialect is deprecated in Hibernate 6 (used by Spring Boot
          3.x). Use MySQLDialect instead, which auto-detects the storage engine.
        recommendation: "Replace MySQL5InnoDBDialect with MySQLDialect"

      - id: rest-template-usage
        title: "RestTemplate usage (consider WebClient/RestClient)"
        severity: optional
        category: framework-upgrade
        domain: java-upgrade
        affectedFiles:
          - src/main/java/com/acme/scm/config/AppConfig.java
          - src/main/java/com/acme/scm/service/VendorService.java
        description: >
          RestTemplate is in maintenance mode. Spring Boot 3.x recommends
          RestClient (synchronous) or WebClient (reactive) for HTTP calls.
        recommendation: "Migrate RestTemplate to RestClient or WebClient"

      - id: field-injection-pattern
        title: "Field injection with @Autowired (prefer constructor injection)"
        severity: optional
        category: code-quality
        domain: java-upgrade
        affectedFiles:
          - src/main/java/com/acme/scm/service/VendorService.java
          - src/main/java/com/acme/scm/service/PurchaseOrderService.java
          - src/main/java/com/acme/scm/service/InventoryService.java
          - src/main/java/com/acme/scm/controller/VendorController.java
          - src/main/java/com/acme/scm/controller/PurchaseOrderController.java
          - src/main/java/com/acme/scm/controller/InventoryController.java
        description: >
          All service and controller classes use @Autowired field injection.
          Constructor injection is recommended for testability and immutability.
        recommendation: "Switch to constructor injection (Lombok @RequiredArgsConstructor)"

      - id: system-out-println
        title: "System.out.println used instead of logger"
        severity: optional
        category: code-quality
        domain: cloud-readiness
        affectedFiles:
          - src/main/java/com/acme/scm/SupplyChainBackendApplication.java
        description: >
          The main application class uses System.out.println for startup
          messages. Use SLF4J/Logback for proper structured logging.
        recommendation: "Replace System.out.println with log.info()"

      - id: dockerfile-java8-base-image
        title: "Dockerfile uses Java 8 base images"
        severity: mandatory
        category: java-version-upgrade
        domain: java-upgrade
        affectedFiles:
          - Dockerfile
        description: >
          Dockerfile uses maven:3.8-openjdk-8 (build) and eclipse-temurin:8-jre
          (runtime). Must be updated when upgrading to Java 17/21.
        recommendation: "Update to maven:3-eclipse-temurin-17 and eclipse-temurin:17-jre"

      - id: rabbitmq-hardcoded-credentials
        title: "RabbitMQ hardcoded credentials in config"
        severity: potential
        category: local-credential
        domain: cloud-readiness
        affectedFiles:
          - src/main/resources/application.yml
        description: >
          RabbitMQ connection uses hardcoded guest/guest credentials. If
          migrating to Azure Service Bus, use Managed Identity or connection
          strings from Key Vault.
        recommendation: "Use Azure Managed Identity or Key Vault secrets"

# ---------------------------------------------------------------------------
# Recommended Upgrade Path
# ---------------------------------------------------------------------------
recommendedUpgradePath:
  phase1_java_upgrade:
    title: "Java 8 → Java 17 LTS"
    effort: "Medium"
    changes:
      - "Update pom.xml java.version to 17"
      - "Update Dockerfile base images to JDK 17"
      - "Test for Java 8→17 API breaking changes"
      - "Update maven-compiler-plugin source/target to 17"

  phase2_spring_boot_upgrade:
    title: "Spring Boot 2.7.18 → Spring Boot 3.2+"
    effort: "High"
    changes:
      - "Upgrade Spring Boot parent to 3.2.x"
      - "Migrate javax.persistence → jakarta.persistence (3 entity classes)"
      - "Replace MySQL5InnoDBDialect → MySQLDialect"
      - "Replace mysql:mysql-connector-java → com.mysql:mysql-connector-j"
      - "Update RestTemplate → RestClient (optional)"
      - "Review and fix any deprecated API usage"

  phase3_azure_migration:
    title: "Migrate to Azure Services"
    effort: "High"
    changes:
      - "MySQL → Azure Database for MySQL Flexible Server"
      - "RabbitMQ → Azure Service Bus (3 queues)"
      - "Hardcoded credentials → Azure Key Vault / Managed Identity"
      - "HTTP URLs → HTTPS"
      - "Dockerfile → Use Microsoft OpenJDK base images"
      - "Deploy to Azure Container Apps / AKS / App Service"

# ---------------------------------------------------------------------------
# Assessment Source Reference
# ---------------------------------------------------------------------------
assessmentReportPath: ".github/appmod/appcat/result/report.json"
