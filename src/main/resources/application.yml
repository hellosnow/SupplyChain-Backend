server:
  port: 8080

spring:
  application:
    name: supplychain-backend

  cloud:
    azure:
      keyvault:
        secret:
          property-sources:
            - name: supplychain-keyvault
              endpoint: ${AZURE_KEYVAULT_ENDPOINT}

  datasource:
    url: jdbc:mysql://mysql:3306/supplychain?useSSL=false&serverTimezone=UTC
    username: ${mysql-username}
    password: ${mysql-password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  rabbitmq:
    host: rabbitmq
    port: 5672
    username: ${rabbitmq-username}
    password: ${rabbitmq-password}

app:
  messaging:
    queue:
      order-created: order.created
      inventory-alert: inventory.alert
      approval-pending: approval.pending

logging:
  level:
    com.acme.scm: DEBUG
    org.hibernate.SQL: DEBUG
