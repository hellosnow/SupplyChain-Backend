server:
  port: 8080

spring:
  application:
    name: supplychain-backend

  datasource:
    url: jdbc:mysql://mysql:3306/supplychain?useSSL=false&serverTimezone=UTC&authenticationPlugins=com.azure.identity.extensions.jdbc.mysql.AzureMysqlAuthenticationPlugin
    username: ${AZURE_MANAGED_IDENTITY_NAME}
    driver-class-name: com.mysql.cj.jdbc.Driver
    azure:
      managed-identity-enabled: true

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  # TECH DEBT: RabbitMQ hardcoded credentials
  # Should be migrated to Azure Service Bus with custom messaging API
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: guest
    password: guest

# Application configuration
app:
  messaging:
    queue:
      order-created: order.created
      inventory-alert: inventory.alert
      approval-pending: approval.pending

logging:
  level:
    com.acme.scm: DEBUG
    org.hibernate.SQL: DEBUG
