server:
  port: 8080

spring:
  application:
    name: supplychain-backend

  datasource:
    url: jdbc:mysql://localhost:3306/supplychain?useSSL=false&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

# Application configuration
app:
  messaging:
    queue:
      order-created: order.created
      inventory-alert: inventory.alert
      approval-pending: approval.pending

logging:
  level:
    com.acme.scm: DEBUG
    org.hibernate.SQL: DEBUG
