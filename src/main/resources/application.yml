server:
  port: 8080

spring:
  application:
    name: supplychain-backend

  datasource:
    url: ${MYSQL_URL:jdbc:mysql://mysql:3306/supplychain?useSSL=true&serverTimezone=UTC}
    username: ${MYSQL_USERNAME:root}
    # password: REDACTED - stored in Azure Key Vault
    password: ${MYSQL_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  # Azure Service Bus (replaces RabbitMQ)
  cloud:
    azure:
      servicebus:
        connection-string: ${AZURE_SERVICE_BUS_CONNECTION_STRING:}
        entity-type: queue

# Azure Key Vault
# Replace <your-vault-name> with your actual Azure Key Vault name
azure:
  keyvault:
    uri: ${AZURE_KEYVAULT_URI:https://<your-vault-name>.vault.azure.net}

# Application configuration
app:
  vendor-rating-service:
    base-url: https://vendor-rating-service/api/ratings
  messaging:
    queue:
      order-created: order.created
      inventory-alert: inventory.alert
      approval-pending: approval.pending

logging:
  level:
    com.acme.scm: DEBUG
    org.hibernate.SQL: DEBUG
