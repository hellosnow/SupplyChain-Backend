server:
  port: 8080

spring:
  application:
    name: supplychain-backend

  # TECH DEBT: Hardcoded credentials (violates guardrails)
  # Should be migrated to Azure Key Vault
  datasource:
    url: jdbc:mysql://mysql:3306/supplychain?useSSL=false&serverTimezone=UTC
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # TECH DEBT: RabbitMQ hardcoded credentials
  # Should be migrated to Azure Service Bus with custom messaging API
  rabbitmq:
    host: rabbitmq
    port: 5672
    username: guest
    password: guest

# Application configuration
app:
  messaging:
    queue:
      order-created: order.created
      inventory-alert: inventory.alert
      approval-pending: approval.pending

logging:
  level:
    com.acme.scm: DEBUG
    org.hibernate.SQL: DEBUG
