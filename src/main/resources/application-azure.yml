spring:
  datasource:
    url: jdbc:mysql://${AZURE_MYSQL_HOST}:3306/supplychain?useSSL=true&requireSSL=true&serverTimezone=UTC
    username: ${AZURE_MYSQL_USERNAME}
    password: ${AZURE_MYSQL_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  cloud:
    azure:
      servicebus:
        connection-string: ${AZURE_SERVICEBUS_CONNECTION_STRING}
      keyvault:
        secret:
          endpoint: ${AZURE_KEYVAULT_URI}

# Application configuration
app:
  messaging:
    queue:
      order-created: order-created
      inventory-alert: inventory-alert
      approval-pending: approval-pending

logging:
  level:
    com.acme.scm: INFO
    org.hibernate.SQL: WARN
